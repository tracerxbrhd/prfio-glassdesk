# Requires Docker Compose 2.24.4+ for !override. Certificates must already exist.
services:
  backend:
    restart: unless-stopped
    environment:
      DJANGO_DEBUG: "false"
      SEED_DEMO: "false"
      DJANGO_ALLOWED_HOSTS: ${PUBLIC_HOSTNAME:?Set your public hostname}
      CSRF_TRUSTED_ORIGINS: https://${PUBLIC_HOSTNAME}
      CORS_ALLOWED_ORIGINS: https://${PUBLIC_HOSTNAME}
  frontend:
    restart: unless-stopped
    ports: !override
      - "443:443"
    volumes:
      - ./frontend/nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_FILE:?Set absolute certificate path}:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_KEY_FILE:?Set absolute private key path}:/etc/nginx/tls/privkey.pem:ro
  db:
    restart: unless-stopped
