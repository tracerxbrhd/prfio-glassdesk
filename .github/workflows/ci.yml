name: Verify GlassDesk
on:
  push:
    branches: [master]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: glassdesk
          POSTGRES_USER: glassdesk
          POSTGRES_PASSWORD: ci-database-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U glassdesk -d glassdesk"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://glassdesk:ci-database-only@localhost:5432/glassdesk
      DJANGO_DEBUG: 'true'
      API_USER_RATE: '3000/minute'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: ruff check backend && ruff format --check backend
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py collectstatic --noinput
      - run: python backend/manage.py test support -v 2
      - run: python backend/manage.py migrate --noinput && python backend/manage.py seed_demo
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run format:check && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python backend/manage.py runserver 127.0.0.1:8103 --noreload > /tmp/glassdesk-api.log 2>&1 &
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            docs/screenshots
            frontend/test-results
          retention-days: 14
